name: 🔦 Lighthouse CI — Performance Audit

on:
  # Roda apenas quando disparado manualmente
  workflow_dispatch:
    inputs:
      url:
        description: 'URL para auditar (ex: https://orcamento-fenix.web.app)'
        required: true
        default: 'https://orcamento-fenix.web.app'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url="${{ github.event.inputs.url }}" \
            --collect.numberOfRuns=3 \
            --assert.preset=lighthouse:recommended \
            --upload.target=temporary-public-storage || true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
