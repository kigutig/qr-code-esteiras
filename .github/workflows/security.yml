name: 🔒 Security — DevSecOps

on:
  push:
    branches: [main]
    # Ignorar commits do Dependabot — ele já roda em PRs
    paths-ignore:
      - 'package-lock.json'
  schedule:
    # Toda segunda-feira às 08:00 UTC (05:00 BRT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Não rodar em commits do Dependabot (ele já tem suas próprias verificações)
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─── 1. npm audit ─────────────────────────────────────────────────────────
  npm-audit:
    name: 🔎 npm Audit
    runs-on: ubuntu-latest
    # Não rodar em pushes do Dependabot
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high --json > npm-audit-report.json || true

      - name: Display audit results
        run: npm audit --audit-level=high || echo "::warning::Vulnerabilities found — check the npm-audit-report artifact"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ─── 2. Trivy — Secrets + Vulnerabilidades ────────────────────────────────
  trivy:
    name: 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy — vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy — secret detection
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # ─── 3. Semgrep — SAST ────────────────────────────────────────────────────
  semgrep:
    name: 🔬 Semgrep SAST
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    # Semgrep pode falhar sem token — não bloqueia o pipeline
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/owasp-top-ten
            p/secrets
          generateSarif: '1'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: 'semgrep'

  # ─── 4. Snyk — Análise de Dependências (opcional) ─────────────────────────
  snyk:
    name: 🐍 Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && secrets.SNYK_TOKEN != ''
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk.sarif
          category: 'snyk'

  # ─── 5. License Check ─────────────────────────────────────────────────────
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0' \
            --excludePackages 'xlsx' \
            --json \
            --out license-report.json || true
          echo "=== LICENSE SUMMARY ==="
          license-checker --summary || true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: license-report.json
          retention-days: 30
