name: 🔒 Security — DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira às 08:00 UTC (05:00 BRT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─── 1. npm audit ─────────────────────────────────────────────────────────
  npm-audit:
    name: 🔎 npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high --json > npm-audit-report.json || true

      - name: Display audit results
        run: |
          echo "=== NPM AUDIT REPORT ==="
          npm audit --audit-level=high || echo "Vulnerabilities found - check report artifact"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ─── 2. Trivy — Secrets + Vulnerabilidades ────────────────────────────────
  trivy:
    name: 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy — vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy — secret detection
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # ─── 3. Semgrep — SAST ────────────────────────────────────────────────────
  semgrep:
    name: 🔬 Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          semgrep \
            --config=p/typescript \
            --config=p/react \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/secrets \
            --sarif \
            --output=semgrep-results.sarif \
            --severity=WARNING \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=coverage \
            . || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'

  # ─── 4. Snyk — Análise de Dependências ───────────────────────────────────
  snyk:
    name: 🐍 Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
          category: 'snyk'

  # ─── 5. License Check ─────────────────────────────────────────────────────
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0' \
            --excludePackages 'xlsx' \
            --json \
            --out license-report.json || true
          echo "=== LICENSE SUMMARY ==="
          license-checker --summary || true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: license-report.json
          retention-days: 30

  # ─── 6. Security Summary PR Comment ───────────────────────────────────────
  security-summary:
    name: 📋 Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, trivy, semgrep, license-check]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with security results
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'npm Audit': '${{ needs.npm-audit.result }}',
              'Trivy': '${{ needs.trivy.result }}',
              'Semgrep SAST': '${{ needs.semgrep.result }}',
              'License Check': '${{ needs.license-check.result }}'
            };
            const allPassed = Object.values(results).every(r => r === 'success');
            const emoji = allPassed ? '✅' : '⚠️';
            const rows = Object.entries(results).map(([name, status]) => {
              const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
              return `| ${name} | ${icon} ${status} |`;
            }).join('\n');
            const body = `## 🔒 Resultado de Segurança (DevSecOps)\n\n${emoji} ${allPassed ? 'Todos os checks de segurança passaram!' : 'Atenção: verifique os resultados de segurança!'}\n\n| Check | Status |\n|---|---|\n${rows}\n\n> Detalhes disponíveis na aba **Security** do repositório.\n\n_Scan executado em: ${new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })}_`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
